name: role-build
on:
  workflow_dispatch:
  push:
    paths: ['tools/build_role.py']
  schedule:
    - cron: '0 6 5 * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal > /dev/null
      - name: Télécharger le rôle géoréférencé 2026 (MAMH, CC-BY 4.0)
        run: curl -sSL -o role.zip https://donneesouvertes.affmunqc.net/role/ROLE2026_FGDB.zip && unzip -q role.zip -d role
      - name: Construire les tuiles par préfixe de lot
        run: python3 tools/build_role.py "$(find role -type d -name '*.gdb' | head -1)"
      - name: Publier sur la branche role-data (hors du site, pour des déploiements légers)
        run: |
          git config user.name "terrain-bot"; git config user.email "terrain-bot@users.noreply.github.com"
          git checkout --orphan role-data-new
          git rm -rfq --cached .
          git add -f data/role
          git commit -qm "role: tuiles $(date +%Y-%m-%d)"
          git push -f origin role-data-new:role-data
